# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Schema version number
version: 1

# The type of configuration schema
kind: CompositeDevice

# Name of the composite device mapping
name: AYN Layout

# Only use this profile if *any* of the given matches matches. If this list is
# empty, then the source devices will *always* be checked.
# /sys/class/dmi/id/product_name
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 3

# Only allow a single source device per composite device of this type.
single_source: false

# One or more source devices to combine into a single virtual device. The events
# from these devices will be watched and translated according to the key map.
source_devices:
  - group: gamepad
    evdev:
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: ayn_mcu
  # >>> paddle-source (xbox-elite profile only)
  # AYN Odin 3 back paddles (M1/M2): a separate gpio-keys device created by
  # SM8750 kernel patch 0510, emitting KEY_F13 (M1, left) / KEY_F14 (M2,
  # right). Matched by name ("gpio-keys-paddles") because its phys_path is
  # shared with the other gpio-keys node. The ayn_mcu map turns KEY_F13/F14
  # into Left/RightPaddle1, so the paddles become real Xbox Elite paddle
  # buttons (BTN_TRIGGER_HAPPY7/5 on the emulated pad).
  #
  # This block is present only for the xbox-elite profile. The Switch Gamepad
  # Profile control STRIPS it (between the >>> / <<< markers) when switching to
  # ds5, leaving the paddle device ungrabbed so input_sense reads the raw
  # KEY_F13/F14 directly for the screen-capture combo (works in every profile).
  - group: gamepad
    evdev:
      name: gpio-keys-paddles
      handler: event*
    capability_map_id: ayn_mcu
  # <<< paddle-source

# Optional configuration for the composite device
options:
  # If true, InputPlumber will automatically try to manage the input device. If
  # this is false, InputPlumber will not try to manage the device unless an
  # external service enables management of the device. Defaults to 'false'
  auto_manage: true

# The target input device(s) to emulate by default.
# xbox-elite is the only InputPlumber target whose emulated pad actually
# exposes the back paddles as evdev buttons (LeftPaddle1/RightPaddle1 ->
# BTN_TRIGGER_HAPPY7/5); the DualSense Edge target drops them through its
# UHID round-trip. So xbox-elite is the default (paddles work out of the box).
# The Switch Gamepad Profile control toggles this to ds5 (DualSense, no
# paddles; the Odin 3 IMU is SLPI-owned so there is no gyro either) via a /run
# override that ALSO strips the paddle-source block above,
# leaving the paddle device ungrabbed so input_sense reads raw KEY_F13/F14 for
# the capture combo (which therefore works in every profile).
target_devices:
  - xbox-elite
  - keyboard
