# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
# Schema version number
version: 2

# The type of configuration schema
kind: CapabilityMap

# Name for the device event map
name: AYN Odin 3 paddles (Xbox Elite profile)

# Unique identifier of the capability mapping
id: ayn_mcu_elite

# Paddle map for the gpio-keys-paddles source when the fork's "Xbox Elite"
# gamepad profile is active. The stock composite targets ds5-edge and maps
# the paddles to Left/RightPaddle2 (the DualSense Edge back-lever bits); the
# xbox-elite override generated by /usr/bin/gamepad-profile retargets to
# xbox-elite and swaps ONLY the paddle-source's capability map to this one:
# Paddle1, which InputPlumber's xpad target emits as BTN_TRIGGER_HAPPY7 (M1,
# left) / BTN_TRIGGER_HAPPY5 (M2, right) - the codes our es_input,
# gamecontrollerdb and input_sense capture combos are baked against.
# Minimal on purpose: this map only ever sees the paddle device (the MCU
# gamepad source keeps the stock ayn_mcu map in both profiles).
mapping:
  - name: Right Paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_C
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle1

  - name: Left Paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_Z
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle1

# List of events to filter from the source devices
filtered_events: []
