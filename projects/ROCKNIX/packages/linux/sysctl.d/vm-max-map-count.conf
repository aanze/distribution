# Raise the per-process memory-mapping limit for Proton/Wine + FEX.
#
# Each mounted game archive, JIT code block and wine address reservation costs
# one mapping, so large x86 titles blow past the 65530 kernel default. Once the
# cap is hit, mmap() returns ENOMEM *while RAM is still free*: wine then spins in
# try_map_free_area, allocate_virtual_memory gives up, and the game dies on an
# unhandled C++ throw that looks nothing like an out-of-memory condition.
#
# Diagnosed on DayZ (Odin 3, 2026-07-25): the process stalled at exactly 65531
# mappings with 9.7 GB free and swap untouched. With this raised it reaches
# 307000+ mappings and loads normally.
#
# Value matches SteamOS.
vm.max_map_count = 2147483642
