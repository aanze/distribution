<?xml version="1.0" encoding="utf-8"?>
<!-- Proton/Perf-Control Tools-menu icon (CPU + cooling fan).
     Fan blades use ABSOLUTE coords (no nested translate+rotate groups) because
     ImageMagick's SVG renderer mis-composes those transforms when baking the
     cover-card (it flings rotated blades into the corner). -->
<svg width="100%" height="100%" viewBox="0 0 1200 1080" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
  <path d="M 0 0 H 1200 V 1080 H 0 V 0 Z" style="fill:rgb(46,46,46);"/>
  <!-- CPU chip -->
  <g style="fill:white;">
    <rect x="372" y="318" width="26" height="40"/>
    <rect x="432" y="318" width="26" height="40"/>
    <rect x="492" y="318" width="26" height="40"/>
    <rect x="372" y="722" width="26" height="40"/>
    <rect x="432" y="722" width="26" height="40"/>
    <rect x="492" y="722" width="26" height="40"/>
    <rect x="298" y="392" width="40" height="26"/>
    <rect x="298" y="452" width="40" height="26"/>
    <rect x="298" y="512" width="40" height="26"/>
    <rect x="552" y="392" width="40" height="26"/>
    <rect x="552" y="452" width="40" height="26"/>
    <rect x="552" y="512" width="40" height="26"/>
  </g>
  <path d="M 360 356 h 170 a 24 24 0 0 1 24 24 v 320 a 24 24 0 0 1 -24 24 h -170 a 24 24 0 0 1 -24 -24 v -320 a 24 24 0 0 1 24 -24 Z" style="fill:white;"/>
  <path d="M 392 408 h 106 a 14 14 0 0 1 14 14 v 236 a 14 14 0 0 1 -14 14 h -106 a 14 14 0 0 1 -14 -14 v -236 a 14 14 0 0 1 14 -14 Z" style="fill:rgb(46,46,46);"/>
  <path d="M 418 470 h 54 v 28 h -54 Z M 418 540 h 54 v 28 h -54 Z M 418 596 h 54 v 28 h -54 Z" style="fill:white;"/>
  <!-- Fan: outer ring + 4 blades (flattened) + hub -->
  <circle cx="820" cy="540" r="210" style="fill:none;stroke:white;stroke-width:26;"/>
  <g style="fill:white;">
    <path d="M 820 506 C 890 486 970 510 988 570 C 970 540 900 532 844 520 C 828 516 820 512 820 506 Z"/>
    <path d="M 854 540 C 874 610 850 690 790 708 C 820 690 828 620 840 564 C 844 548 848 540 854 540 Z"/>
    <path d="M 820 574 C 750 594 670 570 652 510 C 670 540 740 548 796 560 C 812 564 820 568 820 574 Z"/>
    <path d="M 786 540 C 766 470 790 390 850 372 C 820 390 812 460 800 516 C 796 532 792 540 786 540 Z"/>
  </g>
  <circle cx="820" cy="540" r="40" style="fill:white;"/>
</svg>
