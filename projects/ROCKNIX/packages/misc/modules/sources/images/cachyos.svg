<?xml version="1.0" encoding="utf-8"?>
<!-- Proton-CachyOS Tools-menu icon for ROCKNIX (stylised atom = "Proton").
     Dark filled background + white mark, matching the decky / opennow /
     perf-control tool icons so it reads cleanly on the steamlike cover-card
     generator (which samples the dominant opaque colour) instead of a
     white-on-white unreadable square. -->
<svg width="100%" height="100%" viewBox="0 0 1200 1080" version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
  <path d="M 0 0 H 1200 V 1080 H 0 V 0 Z" style="fill:rgb(46,46,46);"/>
  <g fill="none" stroke="#ffffff" stroke-width="40">
    <ellipse cx="600" cy="540" rx="430" ry="170" />
    <ellipse cx="600" cy="540" rx="430" ry="170" transform="rotate(60 600 540)" />
    <ellipse cx="600" cy="540" rx="430" ry="170" transform="rotate(120 600 540)" />
  </g>
  <circle cx="600" cy="540" r="80" fill="#ffffff" />
</svg>
