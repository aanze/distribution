<?xml version="1.0" encoding="utf-8"?>
<!-- OpenNOW (GeForce NOW client) Tools-menu icon for ROCKNIX.
     Dark filled background + white mark, matching the decky / perf-control
     tool icons so it reads cleanly on the steamlike cover-card generator
     (which samples the dominant opaque colour) instead of a white-on-white
     unreadable square. -->
<svg width="100%" height="100%" viewBox="0 0 1200 1080" version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
  <path d="M 0 0 H 1200 V 1080 H 0 V 0 Z" style="fill:rgb(46,46,46);"/>
  <!-- play button: white disc with a play-triangle cut out (evenodd hole
       shows the dark background through it) -->
  <path fill="#ffffff" fill-rule="evenodd" d="
    M 260 600 a 240 240 0 1 0 480 0 a 240 240 0 1 0 -480 0 Z
    M 440 480 L 440 720 L 650 600 Z" />
  <!-- broadcast arcs to the upper right (the 'NOW' streaming signal) -->
  <g fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round">
    <path d="M 800 270 A 90 90 0 0 1 890 360" />
    <path d="M 800 180 A 180 180 0 0 1 980 360" />
    <path d="M 800 90 A 270 270 0 0 1 1070 360" />
  </g>
</svg>
