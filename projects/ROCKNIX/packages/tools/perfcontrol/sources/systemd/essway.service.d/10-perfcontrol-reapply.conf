#
# Re-apply the active Perf Control profile's clock caps whenever the
# EmulationStation session starts.
#
# The Decky plugin applies a per-game profile on launch and restores the
# canonical one on exit, but it does that from Steam's app-lifetime
# notification. Killing the session outright - the panic-kill combo, which
# takes out gamescope/steam/FEX - means the "stopped" notification never
# arrives, so the game's caps are never undone. Nothing detects this: the
# plugin only writes the profile NAME on an explicit user pick, so
# profiles.json still reads "Default" while the hardware is left running a
# game's underclock, and every UI faithfully reports "Default". It survives
# reboots too, because the boot quirk re-applies whatever name is recorded -
# which is the one that was never wrong.
#
# Leaving Steam always comes back through essway (start_steam.sh runs
# "systemctl start essway" once gamescope exits, however it exited), so this is
# the one point every path passes through. Applying caps is idempotent, so the
# ordinary boot and dock-hotplug restarts simply re-assert what is already set.
[Service]
ExecStartPre=-/usr/bin/perfcontrol boot
