#
# steamlike: EmulationStation (essway.service) must start only AFTER
# rocknix-autostart.service has finished, because the common/002 cover re-point
# runs there and rewrites the Tools gamelist <image> entries from the square
# .svg icons to the 2:3 cover-cards. Without this ordering ES races autostart
# and reads the gamelist while it still points at the .svg icons -> the Tools
# shelf shows square icons on a fresh boot.
#
# Upstream rocknix-autostart already declares "Before=emustation.service", but
# ES actually runs via essway.service (emustation.service is disabled), which
# had no such ordering. No dependency cycle: essway is WantedBy=rocknix.target
# (not graphical.target), and rocknix-autostart is After=graphical.target.
[Unit]
After=rocknix-autostart.service
Wants=rocknix-autostart.service
